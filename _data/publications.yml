- title: Recommended reading for good governors. Utopia de Thomas Moro (1637)
  type: Article
  year: 2023
  url: http://www.sederi.org/s33/sederi-yearbook-33-4/
  abstract: "Gerónimo de Medinilla translated Thomas More’s Utopia (1516) into Spanish in 1637, more than a century after the text was printed in Leuven. The paratexts of the translation imply that Medinilla might have published his translation with a practical and political intention, which is reminiscent of the first interpretations of the humanist’s work by sixteenth-century Spanish readers. This paper analyzes two textual references from the translation to discuss the hypothesis that it was offered as a manual for governors. It also proposes an original biography of Gerónimo de Medinilla. This will serve to contextualize the translator and the potential final purpose of the edition." 

- title: Thomas More’s Portrayal in a Twentieth-Century Translation of Utopia
  type: Article
  year: 2021
  url: https://revistaselectronicas.ujaen.es/index.php/grove/article/view/5794/6308
  abstract: "Ramón Esquerra i Clivillés (1909-1938), a Spanish intellectual born and raised in Barcelona, published in 1937 Utopia (El Estado Perfecto), a translation of Utopia (1516) by Thomas More. The translator prepared a large prologue in which he minutely details the life and personality of the humanist and introduces Utopia and its reception in Spain. As a result, this illuminating introductory section becomes a brief piece of literary criticism. The way More is presented and how Esquerra emphasizes some of his most personal features creates a particular image of the humanist: that of a saint. The information shown was carefully chosen by the translator, serving from of More’s latest published biographies to construct a useful context for the reader." 







